name: Deploy NaturalMedix to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmar el despliegue de producción en Cloudflare"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_production
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar configuración de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; }
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("wrangler.jsonc","utf8")); if (!c.account_id || !/^[0-9a-fA-F-]{36}$/.test(c.d1_databases?.[0]?.database_id ?? "")) throw new Error("Falta el account_id o el ID real de D1 en wrangler.jsonc");'

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la aplicación
        run: npm run build

      - name: Publicar en Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
