name: Deploy NaturalMedix to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmar el despliegue de producción en Cloudflare"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_production
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar configuración de Cloudflare y D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "$CLOUDFLARE_D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Configura la variable CLOUDFLARE_D1_DATABASE_ID con el ID real de D1"; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const p="wrangler.jsonc"; const s=fs.readFileSync(p,"utf8"); if (!s.includes("REEMPLAZAR_CON_EL_ID_DE_TU_NUEVA_D1")) throw new Error("No se encontró el marcador esperado de D1"); fs.writeFileSync(p,s.replace("REEMPLAZAR_CON_EL_ID_DE_TU_NUEVA_D1",process.env.CLOUDFLARE_D1_DATABASE_ID));'

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la aplicación
        run: npm run build

      - name: Publicar en Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
